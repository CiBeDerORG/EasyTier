name: T01-06 synchronize Cargo lock and format
on:
  push:
    branches: [feat/automation-center]
    paths:
      - ".github/workflows/t0106-lock-format.yml"
permissions:
  contents: write
jobs:
  lock-and-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - name: Update Cargo.lock for pinned rustls dependencies
        run: cargo metadata --format-version 1 > /dev/null
      - name: Standard format only T01-06 Rust sources
        run: |
          rustfmt --edition 2024 \
            easytier-web/src/asset_agent.rs \
            easytier-web/src/asset_agent_tls.rs \
            easytier-web/src/restful/asset_agent.rs \
            easytier-web/src/restful/assets/server_agent_entry.rs \
            easytier-web/src/migrator/m20261027_000027_asset_agent_bindings.rs
      - name: Commit lock and formatted source
        run: |
          git add Cargo.lock easytier-web/src/asset_agent.rs easytier-web/src/asset_agent_tls.rs \
            easytier-web/src/restful/asset_agent.rs easytier-web/src/restful/assets/server_agent_entry.rs \
            easytier-web/src/migrator/m20261027_000027_asset_agent_bindings.rs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(T01-06): sync Cargo.lock and rustfmt Agent binding"
            git push origin HEAD:feat/automation-center
          fi
