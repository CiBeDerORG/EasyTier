name: EasyTier Automation Executor Image
run-name: "Executor image - ${{ github.event_name }} - ${{ github.ref_name }} - ${{ github.sha }}"

on:
  push:
    branches: ["feat/automation-center"]
    paths:
      - "automation-executor/**"
      - ".github/workflows/automation-executor-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-automation-executor-${{ github.ref }}
  # A newer push/dispatch supersedes earlier running and queued builds of this branch.
  cancel-in-progress: true

jobs:
  build_test_publish:
    name: Build, smoke test and publish executor (amd64)
    if: github.repository == 'CiBeDerORG/EasyTier' && github.ref == 'refs/heads/feat/automation-center'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      LOCAL_IMAGE: easytier-automation-executor:ci
      REGISTRY_IMAGE: ghcr.io/cibederorg/easytier-automation-executor
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build the standalone Linux amd64 image
        uses: docker/build-push-action@v6
        with:
          context: ./automation-executor
          file: ./automation-executor/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: easytier-automation-executor:ci
          labels: |
            org.opencontainers.image.source=https://github.com/CiBeDerORG/EasyTier
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Standalone EasyTier Android automation executor
          cache-from: type=gha,scope=automation-executor-amd64
          cache-to: type=gha,mode=max,scope=automation-executor-amd64

      - name: Smoke test ADB, H264 dependencies and authenticated HTTP startup
        env:
          SMOKE_TOKEN: ci-only-executor-smoke-token-0123456789
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect "$LOCAL_IMAGE" --format '{{.Architecture}}')" = amd64
          docker run --rm --entrypoint adb "$LOCAL_IMAGE" version
          docker run --rm --entrypoint python "$LOCAL_IMAGE" -c 'import av; import aiortc; from aiortc import RTCRtpSender; from automation_executor.app import app; from pathlib import Path; import os; assert av.__version__ == "14.2.0"; assert any(c.mimeType.lower() == "video/h264" for c in RTCRtpSender.getCapabilities("video").codecs); assert Path(os.environ["AUTOMATION_SCRCPY_SERVER"]).is_file(); print("ADB, media imports and H264 codec available")'
          trap 'docker logs executor-ci-smoke || true; docker rm -f executor-ci-smoke >/dev/null 2>&1 || true' EXIT
          docker run --detach --name executor-ci-smoke --network host \
            --tmpfs /var/lib/easytier-automation:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700 \
            -e AUTOMATION_TOKEN="$SMOKE_TOKEN" \
            -e AUTOMATION_CALLBACK_URL=http://127.0.0.1:11211 \
            "$LOCAL_IMAGE"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 \
              -H "Authorization: Bearer $SMOKE_TOKEN" \
              http://127.0.0.1:8766/internal/v1/health > "$RUNNER_TEMP/executor-health.json"; then
              break
            fi
            sleep 1
          done
          test -s "$RUNNER_TEMP/executor-health.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["protocol_version"] == 1; assert d["state"] == "ready"; assert d["executor_id"]; print("Authenticated executor HTTP response verified")' "$RUNNER_TEMP/executor-health.json"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 2 http://127.0.0.1:8766/internal/v1/health)" = 401

      - name: Run executor safety and keyguard unit tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python \
            --mount "type=bind,src=$GITHUB_WORKSPACE/automation-executor/tests,dst=/automation-tests,readonly" \
            "$LOCAL_IMAGE" -m unittest discover -s /automation-tests -p 'test_*.py' -v

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exactly the tested image under branch and immutable commit tags
        shell: bash
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE" "$REGISTRY_IMAGE:sha-$GITHUB_SHA"
          docker tag "$LOCAL_IMAGE" "$REGISTRY_IMAGE:feat-automation-center"
          docker push "$REGISTRY_IMAGE:sha-$GITHUB_SHA"
          docker push "$REGISTRY_IMAGE:feat-automation-center"
          docker buildx imagetools inspect "$REGISTRY_IMAGE:sha-$GITHUB_SHA"
          docker buildx imagetools inspect "$REGISTRY_IMAGE:feat-automation-center"
          {
            echo "### Standalone executor image published"
            echo ""
            echo "- Platform: \`linux/amd64\`"
            echo "- Branch tag: \`$REGISTRY_IMAGE:feat-automation-center\`"
            echo "- Commit tag: \`$REGISTRY_IMAGE:sha-$GITHUB_SHA\`"
            echo "- Image is separate from the EasyTier main Web/Core image."
          } >> "$GITHUB_STEP_SUMMARY"
