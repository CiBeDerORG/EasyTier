name: Server Agent entry unit tests

on:
  push:
    branches:
      - feat/automation-center
    paths:
      - "easytier-web/frontend/src/modules/server-agent-entry.ts"
      - "easytier-web/frontend/tests/server-agent-entry.test.mjs"
      - ".github/workflows/server-agent-entry-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-agent-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify server-only and owner-scoped entry helpers
        run: node --experimental-strip-types --test easytier-web/frontend/tests/server-agent-entry.test.mjs
