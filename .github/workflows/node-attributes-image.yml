name: EasyTier GHCR Image
run-name: "GHCR image - ${{ github.ref_name }} - ${{ github.sha }}"

on:
  workflow_dispatch:
  push:
    branches: ["feat/node-attributes-main"]
    # Publishing is explicit; ordinary source and report pushes do not publish.
    paths: [".github/workflows/node-attributes-image.yml"]

permissions:
  contents: read

concurrency:
  group: ghcr-image-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'

jobs:
  build_web:
    name: Build embedded Web and config generator
    if: github.repository == 'CiBeDerORG/EasyTier' && github.ref == 'refs/heads/feat/node-attributes-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build the same frontend bundle as official releases
        uses: ./.github/actions/prepare-pnpm
        with:
          token: ${{ github.token }}
          build-filter: './easytier-web/*'

      - name: Check embedded frontend inputs
        run: |
          test -s easytier-web/frontend/dist/index.html
          test -s easytier-web/frontend/dist/config-generator/index.html

      - uses: actions/upload-artifact@v5
        with:
          name: ghcr-web-dashboard
          path: easytier-web/frontend/dist/
          if-no-files-found: error
          retention-days: 7

  build_images:
    name: Build and smoke test (${{ matrix.arch }})
    needs: build_web
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact_arch: x86_64
            features: jemalloc
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact_arch: aarch64
            features: mimalloc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
      FEATURES: ${{ matrix.features }}
      REPORT_DIR: process/test/ghcr-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Initialize build record
        run: |
          mkdir -p "$REPORT_DIR"
          printf 'Commit: %s\nPlatform: linux/%s\nRun: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$ARCH" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > "$REPORT_DIR/context.txt"
          printf 'GIT_DESC=%s\n' "$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: ghcr-web-dashboard
          path: easytier-web/frontend/dist/

      - name: Prepare native musl build
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.target }}
          gui: 'false'
          pnpm: 'false'
          token: ${{ github.token }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ghcr-release-${{ matrix.target }}

      - name: Build all four official programs
        run: |
          cargo build --locked --release --target "$TARGET" \
            --package easytier-web --features embed 2>&1 | tee "$REPORT_DIR/build-embed.log"
          mv "target/$TARGET/release/easytier-web" "target/$TARGET/release/easytier-web-embed"
          cargo build --locked --release --target "$TARGET" \
            --features "$FEATURES" 2>&1 | tee "$REPORT_DIR/build-programs.log"
          mkdir -p "docker_context/easytier-linux-$ARTIFACT_ARCH"
          for program in easytier-core easytier-cli easytier-web easytier-web-embed; do
            test -s "target/$TARGET/release/$program"
            install -m 755 "target/$TARGET/release/$program" "docker_context/easytier-linux-$ARTIFACT_ARCH/$program"
          done

      - uses: docker/setup-buildx-action@v3

      - name: Package with the official Dockerfile layout
        run: |
          docker buildx build --load --platform "linux/$ARCH" \
            --file .github/workflows/Dockerfile \
            --tag "easytier-ghcr:$ARCH" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=feat-node-attributes-main" \
            --label "org.opencontainers.image.licenses=LGPL-3.0" \
            --label "org.opencontainers.image.description=EasyTier core, CLI, Web and embedded dashboard from feat/node-attributes-main" \
            docker_context 2>&1 | tee "$REPORT_DIR/docker-build.log"

      - name: Verify binaries, core health and deploy startup interface
        run: bash .github/scripts/ghcr-smoke.sh "easytier-ghcr:$ARCH" "$REPORT_DIR"

      - name: Export the exact image that passed smoke tests
        run: |
          mkdir -p image-artifacts
          docker image inspect "easytier-ghcr:$ARCH" > "$REPORT_DIR/image-inspect.json"
          docker save "easytier-ghcr:$ARCH" | gzip -1 > "image-artifacts/easytier-$ARCH.tar.gz"

      - uses: actions/upload-artifact@v5
        with:
          name: ghcr-image-${{ matrix.arch }}
          path: image-artifacts/easytier-${{ matrix.arch }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload build and smoke evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ghcr-report-${{ matrix.arch }}
          path: process/test/ghcr-${{ matrix.arch }}/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish and verify the multi-platform GHCR image
    needs: build_images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ghcr.io/cibederorg/easytier
      IMAGE_TAG: feat-node-attributes-main
      REPORT_DIR: process/test/ghcr-publish
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: ghcr-image-*
          path: image-artifacts/
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested images and verify registry manifests
        run: bash .github/scripts/ghcr-publish.sh image-artifacts "$REPORT_DIR"

      - name: Upload registry publication evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ghcr-publication-report
          path: process/test/ghcr-publish/
          if-no-files-found: warn
          retention-days: 14
